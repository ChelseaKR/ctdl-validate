name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The most useful reports say what you ran,
        what happened, and what you expected instead.

        If this is a security vulnerability, please do not file it here. See
        SECURITY.md for how to report it privately.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >-
        What you ran and what came back. Paste the output rather than describing it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: >-
        If a rule or spec section says otherwise, quoting it helps a lot.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: The payload
      description: >-
        Paste the smallest payload that reproduces it. Reduce it first if you can: a single entity is easier to act on than a whole graph.
      render: json
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        ctdl-validate --version, or the version you installed from PyPI
    validations:
      required: true
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: >-
        Environment, workarounds you tried, related issues.
    validations:
      required: false
