name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Run the local verification gate
        run: make verify

  # `make verify` covers the action's entry point (tests/test_action_runner.py).
  # This job covers the composite wrapper around it: the inputs in action.yml,
  # the interpreter it pins, and the exit code GitHub actually observes.
  action-self-test:
    name: action self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: A clean document passes
        uses: ./
        with:
          path: tests/fixtures/clean_framework.json

      # The half of a gate that is easy to leave untested. `continue-on-error`
      # here is not a bypass: the step after it fails the job unless this step
      # failed, so the run is red either when the gate is broken or when the
      # gate cannot break.
      - name: A document with an ERROR finding must fail
        id: broken
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/domain_violation.json

      - name: Fail if the gate let the broken document through
        if: steps.broken.outcome != 'failure'
        run: |
          echo "::error::action.yml passed a document with an ERROR finding"
          exit 1
