name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A push to main falls through to the second operand, so keying it on
# `github.ref` put every commit on main into one group `...-refs/heads/main`.
# Two pushes landing close together then cancelled the older run, and that
# commit stayed on main with no verdict: a cancelled run reports `cancelled`,
# not a failure, so nothing goes red and nobody is told it went unchecked.
# `github.sha` gives each commit its own group. Pull requests are unaffected --
# they still key on the PR number and still collapse to one run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Run the local verification gate
        run: make verify

  # `make verify` covers the action's entry point (tests/test_action_runner.py).
  # This job covers the composite wrapper around it: the inputs in action.yml,
  # the interpreter it pins, and the exit code GitHub actually observes.
  action-self-test:
    name: action self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: A clean document passes
        uses: ./
        with:
          path: tests/fixtures/clean_framework.json

      # The half of a gate that is easy to leave untested. `continue-on-error`
      # here is not a bypass: the step after it fails the job unless this step
      # failed, so the run is red either when the gate is broken or when the
      # gate cannot break.
      - name: A document with an ERROR finding must fail
        id: broken
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/domain_violation.json

      - name: Fail if the gate let the broken document through
        if: steps.broken.outcome != 'failure'
        run: |
          echo "::error::action.yml passed a document with an ERROR finding"
          exit 1

      # `sarif-file` is the one input whose effect is a file rather than an
      # exit code, so nothing else here would notice if it stopped producing
      # one. The findings still gate the job, hence continue-on-error again.
      - name: A run with sarif-file still gates, and writes the file
        id: sarif
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/bug_class_25*.json
          sarif-file: ctdl-validate.sarif

      - name: The SARIF is one run, covers both documents, and cites correctly
        # The outcome reaches the script through env: rather than being
        # interpolated into the run: block, the same posture action.yml takes
        # with its own inputs.
        env:
          SARIF_OUTCOME: ${{ steps.sarif.outcome }}
        run: |
          test "$SARIF_OUTCOME" = "failure" \
            || { echo "::error::sarif-file must not change what the gate does"; exit 1; }
          python3 - <<'PY'
          import json, pathlib
          log = json.loads(pathlib.Path("ctdl-validate.sarif").read_text(encoding="utf-8"))
          assert log["version"] == "2.1.0", log["version"]
          runs = log["runs"]
          assert len(runs) == 1, f"{len(runs)} runs; GitHub accepts at most 20 per file"
          run = runs[0]
          assert len(run["properties"]["documents"]) == 2, run["properties"]["documents"]
          assert run["results"], "both fixtures have findings; the file reports none"
          rules = run["tool"]["driver"]["rules"]
          for result in run["results"]:
              assert rules[result["ruleIndex"]]["id"] == result["ruleId"], result["ruleId"]
          digests = run["tool"]["driver"]["properties"]["vendoredSnapshot"]["files"]
          assert len(digests) == 4, digests
          print(f"{len(run['results'])} result(s) in one run, all rule-indexed correctly")
          PY

  # `make verify` covers the hook's entry point (tests/test_pre_commit_hook.py)
  # and asserts the contract in `.pre-commit-hooks.yaml`. Neither can tell you
  # that pre-commit itself can build the environment, find the console script
  # and select the files -- so this job runs the real thing, in both
  # directions, exactly as the action self-test above does for action.yml.
  #
  # pre-commit is pinned here rather than added to the dev group on purpose:
  # `.pre-commit-config.yaml` deliberately keeps it out of the lock (its own
  # comment says so), and this job is the only thing in the repository that
  # needs it. `--python 3.12` is the floor in pyproject; without it pre-commit
  # builds its hook env with whatever interpreter is running it, and an older
  # one fails while installing build dependencies rather than saying why.
  pre-commit-self-test:
    name: pre-commit self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PRE_COMMIT: "pre-commit==4.3.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true

      - name: A clean payload passes the hook
        run: |
          uvx --python 3.12 --from "$PRE_COMMIT" pre-commit try-repo . ctdl-validate \
            --files tests/fixtures/clean_framework.json

      # The half that is easy to leave untested. The exit code is read from the
      # command itself, never through a pipe, and the output is printed before
      # the job decides -- a failing hook's output is what a reader needs most.
      - name: A payload with an ERROR finding must fail the hook
        run: |
          set +e
          uvx --python 3.12 --from "$PRE_COMMIT" pre-commit try-repo . ctdl-validate \
            --files tests/fixtures/bug_class_250_bare_uuid_for_ctid.json > broken.log 2>&1
          code=$?
          set -e
          cat broken.log
          test "$code" -eq 1 || {
            echo "::error::the hook exited $code over a document with two ERROR findings"
            exit 1
          }
          grep -q 'CTID_BARE_UUID' broken.log || {
            echo "::error::the hook failed without naming the finding"
            exit 1
          }

      # The design argument in one step: a wide `types: [json]` selection must
      # not be able to report success on the merits over files nothing checked.
      - name: A file that is not CTDL passes, and the run says it checked nothing
        run: |
          set +e
          uvx --python 3.12 --from "$PRE_COMMIT" pre-commit try-repo . ctdl-validate \
            --verbose --files src/ctdl_validate/report.schema.json > none.log 2>&1
          code=$?
          set -e
          cat none.log
          test "$code" -eq 0 || {
            echo "::error::a repository holding non-CTDL JSON must not fail every commit"
            exit 1
          }
          grep -q 'Nothing was checked' none.log || {
            echo "::error::the run reported success without saying it examined nothing"
            exit 1
          }
