name: Publish to PyPI

# Publishes the sdist + wheel to PyPI using OIDC Trusted Publishing. No API
# token is stored anywhere; PyPI verifies this workflow's identity.
#
# One-time setup on PyPI (pypi.org -> Your projects -> Publishing, or, before
# the project exists, "Add a pending publisher"):
#   PyPI Project Name:  ctdl-validate
#   Owner:              ChelseaKR
#   Repository name:    ctdl-validate
#   Workflow name:      pypi-publish.yml
#   Environment name:   (leave blank)
#
# Mirrors tods-validate's publish path, which is the one already working
# against PyPI:
#   - the release tag is an annotated tag object whose SSH signature verifies
#     against the committed .github/allowed_signers, and which names the
#     commit this run is building, before anything else runs (REL-08);
#   - the full merge gate (`make verify`) re-runs at the tagged commit, and
#     publish does not start unless it is green;
#   - CycloneDX 1.7 SBOM for the built distribution, blocking on any schema
#     violation;
#   - SLSA build provenance attestation for dist/*;
#   - `verify-published` re-downloads what actually landed on PyPI and checks
#     its provenance, so a green run means the public artifact is the verified
#     one, not merely that the upload did not error.
#
# The tag check is the piece that was missing until 2026-09-06. release.yml
# has had it since it was written, through the shared
# ChelseaKR/.github release-authorize workflow, but that workflow requires the
# caller to be dispatched from `main` and this one is triggered by a published
# Release, so it cannot be reused here. The check is the same one:
# `.github/verify-release-tag.sh` against `.github/allowed_signers`, the file
# release-authorize already reads. Without it this workflow published whatever
# a Release event or a `workflow_dispatch` pointed at, and the version check
# below compared that ref's pyproject.toml against that ref's tag name, which
# two arbitrary refs can agree about perfectly well.
#
# Nothing is grandfathered. Every tag this repository has cut -- v0.1.0,
# v0.2.0 and v0.2.1 -- is a signed annotated tag and verifies against the
# committed key today, so GRANDFATHERED_TAGS is empty and no release is
# exempt. The mechanism is still exercised, in tests/test_release_tag_gate.py,
# because an empty list nothing runs is indistinguishable from a feature that
# stopped working.
#
# No caching in the signing/publishing job, deliberately.

on:
  release:
    types: [published]
  workflow_dispatch:

# Least-privilege default; the publish job escalates only what it needs.
permissions:
  contents: read

# Never run two publishes of the same ref at once.
concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: verify-tag (the release tag is one the maintainer signed)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the tag object being verified has to be
          # present locally for `git verify-tag` to read its signature.
          fetch-depth: 0
          persist-credentials: false
      - name: The release tag is signed by a key this repository trusts
        id: verify
        env:
          # Routed through env: rather than interpolated into the run: shell.
          # A tag name is `github` context data and carries no guarantee about
          # shell metacharacters.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXPECT_COMMIT: ${{ github.sha }}
          ALLOWED_SIGNERS: .github/allowed_signers
          # Empty on purpose: see this file's header.
          GRANDFATHERED_TAGS: ""
        run: bash .github/verify-release-tag.sh

  verify:
    name: verify (the same gate CI runs)
    needs: [verify-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.12"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the verified tag names. This used to be the tag name
          # from the event, or `github.ref` on a dispatch, which is the same
          # thing only when something has checked that the tag is real and
          # signed; now something has.
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Run the local verification gate
        run: make verify

      - name: The tag and the packaged version must agree
        # A release tagged v0.1.1 that ships 0.1.0 is worse than a failed
        # publish: PyPI would carry a version this repo never tagged.
        #
        # The tag comes from verify-tag, and the `if:` that used to skip this
        # on workflow_dispatch is gone: verify-tag refuses to resolve a tag
        # for a dispatch from a branch, so by the time this runs there is
        # always a verified tag to check the version against.
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          packaged="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "${TAG#v}" != "$packaged" ]; then
            echo "::error title=version mismatch::tag $TAG does not match pyproject version $packaged"
            exit 1
          fi
          echo "tag $TAG matches packaged version $packaged"

  publish:
    needs: [verify-tag, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # attach the SBOM to the GitHub release
      id-token: write # OIDC for PyPI Trusted Publishing + provenance
      attestations: write # SLSA build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The same verified commit `verify` gated, so the bits published
          # are the bits that passed the gate rather than a second resolution
          # of the same ref.
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build

      # CycloneDX 1.7 SBOM of the built wheel and its dependency closure.
      # Blocking: --validate fails the job on any schema violation.
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install --upgrade cyclonedx-bom
          python -m venv sbom-env
          ./sbom-env/bin/python -m pip install --upgrade pip
          ./sbom-env/bin/python -m pip install dist/*.whl
          cyclonedx-py environment ./sbom-env/bin/python \
            --sv 1.7 \
            --of JSON \
            --output-reproducible \
            --pyproject pyproject.toml \
            --mc-type library \
            --validate \
            -o ctdl-validate-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: ctdl-validate-sbom.cdx.json
          if-no-files-found: error

      # SLSA build provenance for the wheel + sdist.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      # Attach the SBOM to the GitHub release for consumer verification.
      # Only a Release has an asset list to upload into; a dispatch from a
      # verified tag publishes to PyPI and stops there.
      - name: Upload SBOM to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          # Routed through env: rather than interpolated into the run: shell,
          # and taken from the verified tag rather than re-read from the event.
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: gh release upload "$TAG" ctdl-validate-sbom.cdx.json --clobber

  verify-published:
    # Re-fetch what actually landed on PyPI and check its attestation, rather
    # than trusting that `publish` exiting 0 means the right bits are public.
    needs: [verify-tag, publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.verify-tag.outputs.tag }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Wait for the index to pick up the new release
        run: sleep 30
      - name: Download the published distribution from PyPI
        run: |
          set -eu
          VERSION="${TAG#v}"
          python -m pip download "ctdl-validate==$VERSION" --no-deps -d dist-published
      - name: Verify SLSA build provenance attestation
        run: |
          set -eu
          for f in dist-published/*; do
            gh attestation verify "$f" --owner ChelseaKR
          done
